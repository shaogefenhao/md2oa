<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article</title>
    <style>
        body {
            font-family: Georgia, "Times New Roman", serif;
            line-height: 2;
            color: #2c3e50;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f8f9fa;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin-top: 30px;
            margin-bottom: 20px;
            font-weight: 700;
            color: #1a1a1a;
        }

        h1 {
            font-size: 2.5em;
            text-align: center;
            border-bottom: 3px solid #3498db;
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        h2 {
            font-size: 1.8em;
            color: #3498db;
            border-left: 5px solid #3498db;
            padding-left: 15px;
        }

        h3 { font-size: 1.4em; color: #555; }

        p {
            margin-bottom: 20px;
            text-align: justify;
        }

        a {
            color: #3498db;
            text-decoration: underline;
        }

        code {
            padding: 3px 6px;
            background-color: #ecf0f1;
            border-radius: 3px;
            font-family: "Courier New", monospace;
            font-size: 90%;
            color: #c0392b;
        }

        pre {
            padding: 20px;
            background-color: #2c3e50;
            color: #ecf0f1;
            border-radius: 5px;
            overflow-x: auto;
            margin: 20px 0;
            font-size: 14px;
            line-height: 1.4;
        }

        pre code {
            background: none;
            color: inherit;
            padding: 0;
        }

        blockquote {
            padding: 15px 20px;
            background-color: #ecf0f1;
            border-left: 5px solid #3498db;
            margin: 20px 0;
            font-style: italic;
            color: #555;
        }

        ul, ol {
            margin-bottom: 20px;
            padding-left: 30px;
        }

        li {
            margin-bottom: 12px;
            line-height: 1.8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
        }

        table th {
            background-color: #34495e;
            color: white;
            padding: 12px;
            text-align: left;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid #bdc3c7;
        }

        table tr:hover {
            background-color: #ecf0f1;
        }

        hr {
            margin: 40px 0;
            border: none;
            border-top: 3px dashed #3498db;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px 0;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
{{body}}
</body>
</html>

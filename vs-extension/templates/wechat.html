<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeChat Official Account</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
            line-height: 1.6;
            color: #333;
            background: white;
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        h1, h2, h3, h4, h5, h6 {
            margin-top: 20px;
            margin-bottom: 12px;
            font-weight: 600;
            line-height: 1.35;
        }

        h1 {
            font-size: 1.6em;
            color: #1a1a1a;
            text-align: center;
            border-bottom: 2px solid #eb5757;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        h2 {
            font-size: 1.3em;
            color: #1a1a1a;
            border-left: 4px solid #eb5757;
            padding-left: 10px;
        }

        h3 { font-size: 1.1em; color: #333; }

        p {
            margin: 12px 0;
            word-wrap: break-word;
        }

        a {
            color: #eb5757;
            text-decoration: none;
        }

        a:active {
            opacity: 0.7;
        }

        strong {
            color: #000;
            font-weight: 600;
        }

        em {
            color: #666;
        }

        code {
            background-color: #f5f5f5;
            padding: 2px 4px;
            border-radius: 2px;
            font-family: "Monaco", "Menlo", "Ubuntu Mono", monospace;
            font-size: 0.9em;
            color: #666;
        }

        pre {
            background-color: #f5f5f5;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 12px 0;
            font-size: 0.85em;
            line-height: 1.4;
        }

        pre code {
            background: none;
            padding: 0;
            color: #333;
        }

        blockquote {
            padding: 0 12px;
            margin: 12px 0;
            border-left: 3px solid #d3d3d3;
            color: #666;
            font-size: 0.95em;
        }

        ul, ol {
            margin: 12px 0;
            padding-left: 20px;
        }

        li {
            margin-bottom: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 0.9em;
        }

        table th, table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        table th {
            background-color: #f5f5f5;
            font-weight: 600;
        }

        hr {
            height: 0;
            margin: 16px 0;
            border: none;
            border-top: 1px solid #ddd;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 12px 0;
        }

        .footnote {
            font-size: 0.85em;
            color: #999;
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
<div class="container">
{{body}}
</div>
</body>
</html>

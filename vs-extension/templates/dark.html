<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.7;
            color: #e0e0e0;
            max-width: 850px;
            margin: 0 auto;
            padding: 30px;
            background: #1e1e1e;
        }

        h1, h2, h3, h4, h5, h6 {
            color: #61dafb;
            margin-top: 25px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        h1 {
            font-size: 2.2em;
            border-bottom: 2px solid #61dafb;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 1.6em;
            color: #61dafb;
            margin-top: 30px;
        }

        h3 { font-size: 1.3em; color: #a0d995; }

        p {
            margin-bottom: 15px;
            color: #d4d4d4;
        }

        a {
            color: #61dafb;
            text-decoration: none;
            border-bottom: 1px dotted #61dafb;
        }

        a:hover {
            border-bottom: 1px solid #61dafb;
        }

        code {
            padding: 2px 6px;
            background-color: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 3px;
            font-family: "Fira Code", "Source Code Pro", monospace;
            font-size: 90%;
            color: #ce9178;
        }

        pre {
            padding: 15px;
            background-color: #1e1e1e;
            border-left: 3px solid #61dafb;
            border-radius: 3px;
            overflow-x: auto;
            margin: 15px 0;
            font-size: 13px;
            line-height: 1.5;
        }

        pre code {
            background: none;
            border: none;
            color: #d4d4d4;
            padding: 0;
        }

        blockquote {
            padding: 12px 16px;
            background-color: #252526;
            border-left: 3px solid #61dafb;
            margin: 15px 0;
            color: #a0d995;
            font-style: italic;
        }

        ul, ol {
            margin-bottom: 15px;
            padding-left: 25px;
        }

        li {
            margin-bottom: 8px;
            color: #d4d4d4;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        table th {
            background-color: #2d2d30;
            color: #61dafb;
            padding: 10px;
            text-align: left;
            border-bottom: 2px solid #61dafb;
        }

        table td {
            padding: 10px;
            border-bottom: 1px solid #3e3e42;
            color: #d4d4d4;
        }

        table tr:hover {
            background-color: #252526;
        }

        hr {
            margin: 25px 0;
            border: none;
            border-top: 1px solid #404040;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 15px 0;
            border-radius: 3px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
{{body}}
</body>
</html>
